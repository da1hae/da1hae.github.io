<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620"><rect width="100%" height="100%" rx="16" fill="#f6f7f8"/><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="24" y="44" font-size="18" font-weight="700" fill="#202127">콘텐츠의 역할은 고객의 질문에서.</text><rect x="24" y="70" width="312" height="112" rx="12" fill="white" stroke="#dce0e6"/><text x="42" y="99" font-size="15" font-weight="650" fill="#2447ff">01 발견</text><text x="42" y="132" font-size="21" font-weight="700" fill="#202127">어떤 상황에서 쓸까?</text><text x="42" y="161" font-size="16" font-weight="500" fill="#596170">사용 장면</text><rect x="24" y="202" width="312" height="112" rx="12" fill="white" stroke="#dce0e6"/><text x="42" y="231" font-size="15" font-weight="650" fill="#2447ff">02 이해</text><text x="42" y="264" font-size="21" font-weight="700" fill="#202127">무엇이 달라질까?</text><text x="42" y="293" font-size="16" font-weight="500" fill="#596170">핵심 가치</text><rect x="24" y="334" width="312" height="112" rx="12" fill="white" stroke="#dce0e6"/><text x="42" y="363" font-size="15" font-weight="650" fill="#2447ff">03 선택</text><text x="42" y="396" font-size="21" font-weight="700" fill="#202127">나에게 맞는 것은?</text><text x="42" y="425" font-size="16" font-weight="500" fill="#596170">옵션과 조건</text><rect x="24" y="466" width="312" height="112" rx="12" fill="white" stroke="#dce0e6"/><text x="42" y="495" font-size="15" font-weight="650" fill="#2447ff">04 행동</text><text x="42" y="528" font-size="21" font-weight="700" fill="#202127">어디서 시작할까?</text><text x="42" y="557" font-size="16" font-weight="500" fill="#596170">체험 · 구매 안내</text></g></svg>