<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"><rect width="100%" height="100%" rx="16" fill="#f6f7f8"/><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="24" y="44" font-size="30" font-weight="700" fill="#202127">같은 가이드 안에, 다른 자유도.</text><g class="diagram-step" style="--delay:0ms"><rect x="24.0" y="78" width="348.0" height="280" rx="12" fill="white" stroke="#dce0e6"/><text x="42.0" y="116" font-size="22" font-weight="700" fill="#2447ff">브랜드가 확정할 것</text><text x="42.0" y="161" font-size="22" font-weight="500" fill="#202127">제품 정보 · 사용 조건</text><text x="42.0" y="198" font-size="22" font-weight="500" fill="#202127">반드시 보여줄 장면</text><text x="42.0" y="235" font-size="22" font-weight="500" fill="#202127">링크 · 검수 기준</text></g><g class="diagram-step" style="--delay:240ms"><rect x="388.0" y="78" width="348.0" height="280" rx="12" fill="#f0f1f3" stroke="#dce0e6"/><text x="406.0" y="116" font-size="22" font-weight="700" fill="#202127">크리에이터에게 열어둘 것</text><text x="406.0" y="161" font-size="22" font-weight="500" fill="#202127">도입부의 상황</text><text x="406.0" y="198" font-size="22" font-weight="500" fill="#202127">설명하는 순서</text><text x="406.0" y="235" font-size="22" font-weight="500" fill="#202127">평소의 말투</text></g></g></svg>