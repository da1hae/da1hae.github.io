<svg xmlns="http://www.w3.org/2000/svg" width="360" height="710" viewBox="0 0 360 710" role="img" aria-labelledby="title desc"><title id="title">조회, 기억, 탐색은 서로 다른 질문</title><desc id="desc">도달과 시청, 회상과 브랜드 연결, 검색과 방문을 따로 확인합니다. 확정된 순서나 비율을 나타내지 않는 개념도입니다.</desc><rect width="360" height="710" rx="18" fill="#f6f7f8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#202127"><text x="24" y="43" font-size="23" font-weight="750">조회 ≠ 기억 ≠ 탐색</text><text x="24" y="74" font-size="16" fill="#596170">각각의 질문에 맞는 근거가 필요합니다</text><rect x="24" y="100" width="312" height="158" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="128" font-size="14" fill="#2447ff" font-weight="700">01 / 도달 · 시청</text><text x="42" y="162" font-size="23" font-weight="750">얼마나 보았나</text><text x="42" y="196" font-size="17">콘텐츠에 닿은 범위와 시청</text><path d="M42 213h276" stroke="#d9dee7"/><text x="42" y="240" font-size="15" fill="#596170">브랜드 기억을 보장하지 않음</text><rect x="24" y="276" width="312" height="158" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="304" font-size="14" fill="#2447ff" font-weight="700">02 / 회상 · 브랜드 연결</text><text x="42" y="338" font-size="23" font-weight="750">무엇을 기억하나</text><text x="42" y="372" font-size="17">브랜드명과 제품의 사용 맥락</text><path d="M42 389h276" stroke="#d9dee7"/><text x="42" y="416" font-size="15" fill="#596170">조회수만으로 알 수 없음</text><rect x="24" y="452" width="312" height="158" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="480" font-size="14" fill="#2447ff" font-weight="700">03 / 검색 · 방문</text><text x="42" y="514" font-size="23" font-weight="750">무엇을 찾아보나</text><text x="42" y="548" font-size="17">관찰 가능한 후속 행동</text><path d="M42 565h276" stroke="#d9dee7"/><text x="42" y="592" font-size="15" fill="#596170">노출 효과 전체를 뜻하지 않음</text><rect x="24" y="644" width="312" height="42" rx="8" fill="#202127"/><text x="180.0" y="671" text-anchor="middle" font-size="15" fill="white">지표를 합쳐 하나의 효과로 단정하지 않습니다</text></g></svg>