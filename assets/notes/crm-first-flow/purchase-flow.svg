<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">고객 상태에 맞춘 첫 구매 이후 CRM</title><desc id="desc">주문 확인, 사용 안내, 피드백, 재구매 제안. 각 단계의 발송 전에 제외 조건을 확인하는 설계 개념도입니다.</desc><rect width="760" height="520" rx="20" fill="#f6f7f8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#202127"><text x="24" y="44" font-size="28" font-weight="750">날짜보다 고객의 상태</text><text x="24" y="74" font-size="18" fill="#596170">필요한 안내를 선택하는 설계 개념도</text><rect x="24" y="106" width="348" height="132" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="138" fill="#2447ff" font-size="16" font-weight="700">01</text><text x="80" y="139" font-size="22" font-weight="750">주문 확인</text><text x="42" y="177" font-size="19">주문과 배송 정보</text><text x="42" y="209" font-size="16" fill="#596170">구매 직후의 불확실성 해소</text><rect x="388" y="106" width="348" height="132" rx="12" fill="white" stroke="#d9dee7"/><text x="406" y="138" fill="#2447ff" font-size="16" font-weight="700">02</text><text x="444" y="139" font-size="22" font-weight="750">사용 안내</text><text x="406" y="177" font-size="19">시작 방법과 보관법</text><text x="406" y="209" font-size="16" fill="#596170">수령 · 사용 시점 확인</text><rect x="24" y="256" width="348" height="132" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="288" fill="#2447ff" font-size="16" font-weight="700">03</text><text x="80" y="289" font-size="22" font-weight="750">피드백</text><text x="42" y="327" font-size="19">불편과 사용 후 의견</text><text x="42" y="359" font-size="16" fill="#596170">사용할 시간이 지난 뒤</text><rect x="388" y="256" width="348" height="132" rx="12" fill="white" stroke="#d9dee7"/><text x="406" y="288" fill="#2447ff" font-size="16" font-weight="700">04</text><text x="444" y="289" font-size="22" font-weight="750">재구매 제안</text><text x="406" y="327" font-size="19">필요해지는 시점의 제안</text><text x="406" y="359" font-size="16" fill="#596170">상품별 구매 주기 검토</text><rect x="24" y="418" width="712" height="76" rx="10" fill="#fff0e9"/><text x="40" y="447" font-size="18" font-weight="700">발송 전, 한 번 더 확인</text><text x="40" y="472" font-size="16">취소 · 환불 / 수신 상태 / 이미 재구매 / 중복 안내</text></g></svg>