<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">고객 상태에 맞춘 첫 구매 이후 CRM</title><desc id="desc">주문 확인, 사용 안내, 피드백, 재구매 제안. 각 단계의 발송 전에 제외 조건을 확인하는 설계 개념도입니다.</desc><rect width="360" height="900" rx="20" fill="#f6f7f8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#202127"><text x="24" y="44" font-size="23" font-weight="750">날짜보다 고객의 상태</text><text x="24" y="74" font-size="16" fill="#596170">필요한 안내를 선택하는 설계 개념도</text><rect x="24" y="108" width="312" height="140" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="140" fill="#2447ff" font-size="16" font-weight="700">01</text><text x="80" y="141" font-size="22" font-weight="750">주문 확인</text><text x="42" y="179" font-size="19">주문과 배송 정보</text><text x="42" y="211" font-size="16" fill="#596170">구매 직후의 불확실성 해소</text><path d="M180 251v15m-5-5 5 5 5-5" stroke="#2447ff" stroke-width="2" fill="none"/><rect x="24" y="270" width="312" height="140" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="302" fill="#2447ff" font-size="16" font-weight="700">02</text><text x="80" y="303" font-size="22" font-weight="750">사용 안내</text><text x="42" y="341" font-size="19">시작 방법과 보관법</text><text x="42" y="373" font-size="16" fill="#596170">수령 · 사용 시점 확인</text><path d="M180 413v15m-5-5 5 5 5-5" stroke="#2447ff" stroke-width="2" fill="none"/><rect x="24" y="432" width="312" height="140" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="464" fill="#2447ff" font-size="16" font-weight="700">03</text><text x="80" y="465" font-size="22" font-weight="750">피드백</text><text x="42" y="503" font-size="19">불편과 사용 후 의견</text><text x="42" y="535" font-size="16" fill="#596170">사용할 시간이 지난 뒤</text><path d="M180 575v15m-5-5 5 5 5-5" stroke="#2447ff" stroke-width="2" fill="none"/><rect x="24" y="594" width="312" height="140" rx="12" fill="white" stroke="#d9dee7"/><text x="42" y="626" fill="#2447ff" font-size="16" font-weight="700">04</text><text x="80" y="627" font-size="22" font-weight="750">재구매 제안</text><text x="42" y="665" font-size="19">필요해지는 시점의 제안</text><text x="42" y="697" font-size="16" fill="#596170">상품별 구매 주기 검토</text><rect x="24" y="778" width="312" height="98" rx="10" fill="#fff0e9"/><text x="40" y="807" font-size="18" font-weight="700">발송 전, 한 번 더 확인</text><text x="40" y="832" font-size="16">취소 · 환불 / 수신 상태</text><text x="40" y="856" font-size="16">이미 재구매 / 중복 안내</text></g></svg>